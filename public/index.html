<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SnapURL — URL Shortener</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0f14;
      --card:     #141720;
      --border:   #1f2433;
      --accent:   #00e5ff;
      --accent2:  #7c3aed;
      --text:     #e8eaf0;
      --muted:    #6b7280;
      --success:  #10b981;
      --danger:   #ef4444;
      --mono:     'Space Mono', monospace;
      --sans:     'Syne', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    /* noise overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .wrap { max-width: 740px; margin: 0 auto; position: relative; z-index: 1; }

    /* HEADER */
    header { text-align: center; margin-bottom: 3rem; }
    .logo {
      display: inline-flex; align-items: center; gap: .5rem;
      font-size: 2.4rem; font-weight: 800; letter-spacing: -1px;
    }
    .logo span { color: var(--accent); }
    .logo-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.4); opacity: .6; }
    }
    .tagline { color: var(--muted); font-family: var(--mono); font-size: .78rem; margin-top: .5rem; letter-spacing: 2px; }

    /* CARD */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 1.5rem;
    }

    /* FORM */
    .input-row { display: flex; gap: .75rem; flex-wrap: wrap; }
    .input-wrap { flex: 1; min-width: 200px; }
    label { display: block; font-size: .75rem; color: var(--muted); font-family: var(--mono); letter-spacing: 1px; margin-bottom: .4rem; }

    input[type="text"], input[type="url"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .7rem 1rem;
      color: var(--text);
      font-family: var(--mono);
      font-size: .88rem;
      outline: none;
      transition: border-color .2s;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,229,255,.08); }
    input::placeholder { color: var(--muted); }

    .btn {
      padding: .75rem 1.6rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-family: var(--sans);
      font-weight: 600;
      font-size: .9rem;
      transition: all .2s;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--accent);
      color: #000;
      align-self: flex-end;
    }
    .btn-primary:hover { background: #00bcd4; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,229,255,.25); }
    .btn-primary:active { transform: translateY(0); }

    /* RESULT */
    .result {
      display: none;
      margin-top: 1.2rem;
      background: rgba(0,229,255,.05);
      border: 1px solid rgba(0,229,255,.2);
      border-radius: 10px;
      padding: 1rem 1.2rem;
      animation: fadeIn .3s ease;
    }
    .result.show { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

    .result-url {
      flex: 1;
      font-family: var(--mono);
      font-size: .9rem;
      color: var(--accent);
      word-break: break-all;
    }
    .btn-copy {
      background: var(--border);
      color: var(--text);
      padding: .45rem .9rem;
      font-size: .78rem;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .btn-copy:hover { background: var(--accent2); border-color: var(--accent2); color: #fff; }
    .btn-copy.copied { background: var(--success); border-color: var(--success); color: #fff; }

    /* ERROR */
    .error-msg {
      display: none;
      margin-top: .8rem;
      color: var(--danger);
      font-family: var(--mono);
      font-size: .8rem;
    }
    .error-msg.show { display: block; }

    /* SECTION TITLE */
    .section-title {
      font-size: .7rem;
      font-family: var(--mono);
      letter-spacing: 2px;
      color: var(--muted);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: .6rem;
    }
    .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* URL LIST */
    #url-list { display: flex; flex-direction: column; gap: .75rem; }

    .url-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: .9rem 1.1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: border-color .2s;
      animation: fadeIn .3s ease;
    }
    .url-item:hover { border-color: #2a3050; }

    .url-info { flex: 1; min-width: 0; }
    .url-short {
      font-family: var(--mono);
      font-size: .85rem;
      color: var(--accent);
      font-weight: 700;
    }
    .url-original {
      font-size: .78rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: .2rem;
    }

    .url-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: .25rem;
      flex-shrink: 0;
    }
    .clicks-badge {
      background: rgba(124,58,237,.15);
      border: 1px solid rgba(124,58,237,.3);
      color: #a78bfa;
      font-family: var(--mono);
      font-size: .72rem;
      padding: .2rem .55rem;
      border-radius: 999px;
    }
    .btn-delete {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      padding: .2rem .4rem;
      border-radius: 4px;
      transition: color .2s;
    }
    .btn-delete:hover { color: var(--danger); }

    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--muted);
      font-family: var(--mono);
      font-size: .82rem;
    }
    .empty-state .icon { font-size: 2.5rem; display: block; margin-bottom: .75rem; opacity: .4; }

    /* FOOTER */
    footer {
      text-align: center;
      margin-top: 2.5rem;
      font-family: var(--mono);
      font-size: .72rem;
      color: var(--muted);
    }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">Snap<span>URL</span> <div class="logo-dot"></div></div>
    <p class="tagline">// FAST  •  CLEAN  •  OPEN SOURCE</p>
  </header>

  <!-- INPUT CARD -->
  <div class="card">
    <div class="input-row">
      <div class="input-wrap" style="flex:2">
        <label>LONG URL</label>
        <input type="url" id="urlInput" placeholder="https://your-long-url.com/goes/here" />
      </div>
      <div class="input-wrap" style="flex:1">
        <label>CUSTOM ALIAS (optional)</label>
        <input type="text" id="aliasInput" placeholder="my-link" maxlength="20" />
      </div>
      <button class="btn btn-primary" onclick="shorten()">Shorten →</button>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <div class="result" id="result">
      <span class="result-url" id="shortUrlDisplay"></span>
      <button class="btn btn-copy" id="copyBtn" onclick="copyUrl()">Copy</button>
    </div>
  </div>

  <!-- LIST CARD -->
  <div class="card">
    <div class="section-title">RECENT LINKS</div>
    <div id="url-list"><div class="empty-state"><span class="icon">🔗</span>No links yet. Shorten your first URL above!</div></div>
  </div>

  <footer>
    Built by <a href="https://linkedin.com/in/zohaib-developer" target="_blank">Muhammad Zohaib Safdar</a>
    &nbsp;•&nbsp;
    <a href="https://github.com/zohaibsafdar" target="_blank">GitHub</a>
  </footer>

</div>

<script>
  let lastShortUrl = '';

  async function shorten() {
    const url     = document.getElementById('urlInput').value.trim();
    const alias   = document.getElementById('aliasInput').value.trim();
    const errEl   = document.getElementById('errorMsg');
    const resEl   = document.getElementById('result');

    errEl.className = 'error-msg';
    resEl.className = 'result';

    if (!url) return showError('Please enter a URL');

    try {
      const res  = await fetch('/api/shorten', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url, customAlias: alias || undefined }),
      });
      const data = await res.json();

      if (!res.ok) return showError(data.error || 'Something went wrong');

      lastShortUrl = data.shortUrl;
      document.getElementById('shortUrlDisplay').textContent = data.shortUrl;
      resEl.className = 'result show';
      document.getElementById('copyBtn').textContent = 'Copy';
      document.getElementById('copyBtn').className = 'btn btn-copy';

      document.getElementById('urlInput').value  = '';
      document.getElementById('aliasInput').value = '';
      loadUrls();
    } catch {
      showError('Server error. Is the server running?');
    }
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.className = 'error-msg show';
  }

  function copyUrl() {
    navigator.clipboard.writeText(lastShortUrl).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = '✓ Copied!';
      btn.className = 'btn btn-copy copied';
      setTimeout(() => {
        btn.textContent = 'Copy';
        btn.className = 'btn btn-copy';
      }, 2000);
    });
  }

  async function loadUrls() {
    const res  = await fetch('/api/urls');
    const urls = await res.json();
    const list = document.getElementById('url-list');

    if (!urls.length) {
      list.innerHTML = '<div class="empty-state"><span class="icon">🔗</span>No links yet. Shorten your first URL above!</div>';
      return;
    }

    list.innerHTML = urls.map(u => `
      <div class="url-item" id="item-${u.shortId}">
        <div class="url-info">
          <div class="url-short"><a href="/${u.shortId}" target="_blank" style="color:inherit;text-decoration:none">${location.origin}/${u.shortId}</a></div>
          <div class="url-original" title="${u.originalUrl}">${u.originalUrl}</div>
        </div>
        <div class="url-meta">
          <span class="clicks-badge">${u.clicks} clicks</span>
          <button class="btn-delete" title="Delete" onclick="deleteUrl('${u.shortId}')">✕</button>
        </div>
      </div>
    `).join('');
  }

  async function deleteUrl(shortId) {
    await fetch(`/api/urls/${shortId}`, { method: 'DELETE' });
    loadUrls();
  }

  // Enter key support
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') shorten();
  });

  loadUrls();
</script>
</body>
</html>
